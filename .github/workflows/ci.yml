# CI: the gate on Node 22, 24 and 26 and on Bun.
#
# The gate (`pnpm install --frozen-lockfile && pnpm run gate`) is the one
# command that runs every check: the codegen drift checks, the repository
# rules, the type-check, the build, the test suite, the package-contents
# check, the standalone binary, the Rust, Python and Go clients, and
# actionlint on these workflows. Besides Node and pnpm it needs Bun (the
# standalone ari-driver is built with `bun build --compile`, and the consumer
# tests run the installed package and the README quickstarts under Bun), Go
# (gofmt, the Go client, actionlint), Rust and uv (the Python client).
#
# The Node legs run the gate on each supported Node major with the Bun
# release the repository is developed with. The Bun leg runs the same gate
# with the newest Bun release, so a Bun change shows up without moving the
# pinned toolchain. The test suite runs on Node's test runner, which Bun
# implements only in part (the conformance kit's node:test adapter fails
# under it), so in every leg Bun runs the package through the consumer tests
# (the installed ari, ari/host and ari/conformance, the conformance suite
# against the reference driver, both README quickstarts) and through the
# compiled ari-driver.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node 22
            node: "22"
            bun: "1.3.14"
          - runtime: Node 24
            node: "24"
            bun: "1.3.14"
          - runtime: Node 26
            node: "26"
            bun: "1.3.14"
          - runtime: Bun
            node: "26"
            bun: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.5"
          # clients/go has no dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"

      - name: Show the toolchain
        run: |
          node --version
          pnpm --version
          bun --version
          go version
          cargo --version
          uv --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gate
        run: pnpm run gate
